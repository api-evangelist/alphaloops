  - name: AlphaLoops MCP Server
    description: >-
      Hosted remote Model Context Protocol server exposing 2.7M U.S. motor carriers as tools for LLM clients
      (Claude Desktop/Code, Cursor, Windsurf, VS Code Copilot, Clay). Advertises 30+ tools across six categories —
      lookup, search, scoring, safety, risk and contacts — of which 24 are named publicly. Bearer-token auth over
