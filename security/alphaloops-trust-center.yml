description: >-
  AlphaLoops publishes a security page at https://runalphaloops.com/security and operates a
  Vanta-hosted Trust Center at https://trust.runalphaloops.com/ (linked from the site footer).
  The Trust Center returned HTTP 200 but is fully client-rendered — no certification names,
  control list, or document index are present in the served HTML, and the Vanta trust-page API
  paths probed anonymously return the SPA shell rather than JSON. The certifications below are
  therefore read from the PUBLIC SECURITY PAGE, not from the Trust Center itself.

# IMPORTANT — these are the claims as WORDED by the provider. AlphaLoops describes itself as
# "aligned with" ISO 27001 and built on "SOC 2 certified infrastructure". That is a posture
# statement about controls and about its cloud vendors; it is NOT an assertion that AlphaLoops
# itself holds a SOC 2 or ISO 27001 certificate, and no audit report, certificate number, or
# auditor is named on any public page. Recorded verbatim so the distinction is not lost.
certifications:
  - name: SOC 2 Type II
    claim: infrastructure
    status: claimed-alignment
    verbatim: 'SOC 2 Type II infrastructure'
    certificate_published: false
    note: >-
      Stated as the compliance posture of the underlying infrastructure. No SOC 2 report,
      certificate, or auditor is named on a public page, and the Trust Center that would
      normally host the report is not machine-readable.
  - name: ISO 27001
    claim: aligned
    status: claimed-alignment
    verbatim: 'ISO 27001 aligned controls'
    certificate_published: false
    note: Described as "aligned with" / "aligned controls" — not stated as a held certification.
  - name: NIST Cybersecurity Framework
    claim: aligned
    status: claimed-alignment
    verbatim: 'NIST Cybersecurity Framework'
    certificate_published: false
  - name: COBIT
    claim: aligned
    status: claimed-alignment
    verbatim: 'COBIT governance domains'
    certificate_published: false

