# Gaps worth naming to the provider, in priority order.
gaps:
  - id: oauth-protected-resource
    detail: >-
      The MCP host publishes the authorization-server half of the pair but not
      /.well-known/oauth-protected-resource (RFC 9728), which is the document an MCP client uses to
      discover WHICH authorization server protects the resource. The 401 on /mcp does carry a
      WWW-Authenticate header with authorization_uri, so discovery is possible — but via a
      non-standard hint rather than the standard document.
    severity: medium
  - id: no-security-txt
    detail: >-
      RFC 9116 security.txt is served on no host, even though a disclosure address and a 24-hour
      response commitment are published in prose at /security.
    severity: medium
  - id: no-api-catalog
    detail: >-
      No RFC 9727 /.well-known/api-catalog, and the advertised /apis.json returns the SPA shell.
    severity: low
