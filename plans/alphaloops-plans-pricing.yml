# The buyer-facing consequence of the two ladders.
contradictions:
  - id: api-access-price
    detail: >-
      Reading the pricing page, API access costs $4,000/month (Enterprise-only). Reading the MCP
      page, API access starts free and production use is "from $499/mo". Both pages were live and
      served 200 on 2026-08-11. The same al_-prefixed Bearer key authenticates both surfaces, so
      these are almost certainly one product described by two ladders that have not been reconciled.
    sources:
      - https://runalphaloops.com/pricing
      - https://runalphaloops.com/mcp
      - https://runalphaloops.com/fmcsa-api/docs
    unresolved: true
  - id: webhooks-tier
    detail: >-
      Webhooks are an Enterprise-only bullet on the pricing page but a Pro-tier inclusion on the
      MCP page. Neither page links to any webhook documentation, and no webhook catalog, event
      list, or AsyncAPI is published anywhere on the site — see the note in
      lifecycle/alphaloops-lifecycle.yml.

