event_surface:
  webhooks_advertised: true
  webhooks_documented: false
  asyncapi: false
  note: >-
    "Webhooks" is sold as a plan inclusion on both the pricing page (Enterprise) and the MCP page
    (Pro) and the HubSpot integration note mentions "webhook support", but NO webhook
    documentation exists on the public site — no event catalog, no payload schemas, no signing or
    retry semantics, no subscription endpoint in the OpenAPI, and no AsyncAPI. This repo therefore
    carries no asyncapi/ artifact and no Webhooks pointer: the surface is sold but not specified.
    The closest published thing is the read-only change feed
    GET /v1/carriers/{dot_number}/timeline, which returns detected change events with
    event_type, field_name, old_value, new_value and source — a polling substitute for the
    webhooks that are not documented.

