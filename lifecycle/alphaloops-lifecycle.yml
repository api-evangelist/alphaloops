description: >-
  Versioning, deprecation, status and SLA posture for AlphaLoops. Assembled from the MCP reference
  page (which carries the only published versioning and deprecation policy), the API reference, the
  live status page, and the live OpenAPI.

versioning:
  rest:
    style: uri-path
    current_version: v1
    prefix: /v1/
    spec_info_version: 1.0.0
    policy_published: false
    note: >-
      The REST surface is path-versioned at /v1/ but publishes NO versioning policy — nothing states
      what constitutes a breaking change, how a v2 would be introduced, or how long v1 is supported.
  mcp:
    style: header-pinned
    header: X-AlphaLoops-Version
    default_when_omitted: latest
    policy_published: true
    verbatim: >-
      "Tool schemas are header-pinned via the X-AlphaLoops-Version header. Without the header, you
      receive the latest version. Breaking changes are released under a new version with a 90-day
      deprecation window for the prior version. Additive changes ship continuously without a
      version bump."
    source: https://runalphaloops.com/mcp
  asymmetry_note: >-
    The agent surface has a better-specified version contract than the REST surface it wraps. Note
    also the default: omitting the header floats you to latest, so an unpinned MCP client inherits
    breaking changes at the 90-day boundary whether or not it is ready.

deprecation:
  policy_published: true
  scope: MCP tool schemas only
  window: 90 days
  mechanism: New version issued; prior version supported for the deprecation window.
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    A stated 90-day window is real policy and better than most, but it is prose on a marketing
    reference page — not RFC 8594 Sunset/Deprecation response headers, and not applied to REST.
  deprecated_operations_in_spec: []
  spec_scan: >-
    No operation in the OpenAPI carries `deprecated: true`. One endpoint is marked forward-looking
    rather than deprecated — GET /v1/carriers/{dot_number}/safety is labelled "COMING SOON" in the
    documentation and is absent from the OpenAPI entirely, so the docs describe a surface the
    contract does not yet contain.

