# A REAL, RECONCILABLE-ONLY-BY-THE-PROVIDER CONTRADICTION. Three public pages describe three
# different commercial gates on the same underlying data, and a developer cannot tell from the
# outside which one governs.
contradictions:
  - id: api-access-tier
    detail: >-
      The API reference and the OpenAPI description both state API access is "available exclusively
      on the Enterprise plan" (Enterprise is $4,000/month on the pricing page, where "API Access" is
      an Enterprise-only bullet). The MCP page simultaneously advertises a FREE tier with 1,000
      requests/month and a Pro tier "from $499/mo" with 100K requests/month, and its call to action
      is "Get an API key" with "Free tier available."
    sources:
      - {url: 'https://runalphaloops.com/fmcsa-api/docs', claim: 'API access is available exclusively on our Enterprise plan'}
      - {url: 'https://runalphaloops.com/pricing', claim: 'API Access listed only under Enterprise, $4,000/month billed annually'}
      - {url: 'https://runalphaloops.com/mcp', claim: 'Free $0 — 1,000 requests per month. Pro FROM $499/MO — 100K requests per month.'}
      - {url: 'https://runalphaloops.com/openapi.json', claim: 'API access is available exclusively on the Enterprise plan. Contact sales...'}
    unresolved: true
    note: >-
      Both surfaces authenticate with the same AlphaLoops API key (al_ prefix), so this is unlikely
      to be two separate products. Most plausible reading is that the MCP page reflects a newer
      self-serve ladder the REST docs and pricing page have not caught up with — but that is
      inference, and it is not recorded as fact.
  - id: window-units-differ
    detail: >-
      REST limits are published per-minute and per-day; MCP limits are published per-month. No page
      states a per-minute ceiling for MCP or a monthly ceiling for REST, so the two ladders cannot
      be compared without contacting sales.

