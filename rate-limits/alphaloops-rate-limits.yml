description: >-
  Published rate limits for the AlphaLoops FMCSA Carrier Data API and the AlphaLoops MCP server.
  The REST limits and the full response-header set are documented in the "Rate Limits" section of
  the API reference; the MCP limits are published separately on the MCP reference page. THEY DO
  NOT DESCRIBE THE SAME LADDER — see the contradiction block below.

limit_count: 5

# The runtime signal — this is what an agent actually needs, and AlphaLoops publishes it well.
response_headers:
  - name: X-RateLimit-Limit
    meaning: Per-minute request ceiling
    example: '60'
  - name: X-RateLimit-Remaining
    meaning: Requests left in the current minute window
    example: '47'
  - name: X-RateLimit-Reset
    meaning: Unix epoch seconds when the per-minute window resets
    example: '1709325600'
  - name: X-DailyLimit-Limit
    meaning: Per-day request ceiling
    example: '5000'
  - name: X-DailyLimit-Remaining
    meaning: Requests left in the current day window
    example: '4832'
  - name: X-DailyLimit-Reset
    meaning: Unix epoch seconds when the daily window resets
    example: '1709337600'
  - name: Retry-After
    meaning: Seconds to wait before retrying
    type: integer
    declared_in: OpenAPI components.responses.RateLimited.headers
  - name: X-Enrichment-Credits-Remaining
    meaning: Enrichment credits left (contact enrichment is credit-metered, not rate-limited)
    related_status: 402
returned_on_every_response: true
verbatim: 'Rate limit headers are included in every response'
naming_note: >-
  Custom X- prefixed headers rather than the RFC 9239 / draft-ietf-httpapi-ratelimit-headers
  RateLimit-Limit / RateLimit-Remaining / RateLimit-Reset form. Retry-After is standard.
exhausted_status: 429
exhausted_body: '{"error": "...", "message": "..."}'

