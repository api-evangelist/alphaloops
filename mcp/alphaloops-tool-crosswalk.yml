source: >-
  Derived by binding the MCP tool inventory published at https://runalphaloops.com/mcp to the
  operationIds in the live OpenAPI 3.1 at https://runalphaloops.com/openapi.json
  (saved at openapi/alphaloops-fmcsa-carrier-data-api-openapi.json, 25 operations, 53 schemas).
purpose: >-
  Give each MCP tool a real inputSchema. The live tools/list is auth-gated (401), so no tool
  parameters are published anywhere. Where a tool binds to a REST operation, that operation's
  parameters and requestBody ARE the tool's contract — an agent developer can read the real shape
  out of the OpenAPI today without a key. Where a tool has no REST backing, that is stated, not
  guessed.

surfaces:
  rest_openapi:
    path: openapi/alphaloops-fmcsa-carrier-data-api-openapi.json
    url: https://runalphaloops.com/openapi.json
    http_status: 200
    gated: false
    operations: 25
  mcp:
    url: https://mcp-freight.runalphaloops.com/mcp
    http_status: 401
    gated: true
    note: tools/list requires a Bearer API key; tool names taken from the provider MCP page.
  graphql:
    present: false

# Confidence policy for this file: `high` means the tool name and the operation describe the same
# resource and action unambiguously (carrier_lookup -> getCarrierByDot). `medium` means the mapping
# is semantically clear but the tool may compose or reshape the operation. Nothing is `high` on the
# basis of name similarity alone where the REST surface has more than one plausible target.
