# Tools with no public REST operation behind them. These are the platform's list-management and
# scoring surface — the part of AlphaLoops that is NOT in the published API contract at all.
# An agent can invoke them; a REST integrator cannot reach them.
mcp_only:
  - tool: carrier_score
    reason: >-
      ICP/risk/displacement scoring. No scoring operation exists in the OpenAPI. The changelog
      describes this capability (AI-Powered Account Ranking, CarrierMatch, carrier embeddings) as
      an app feature, never as a REST endpoint.
  - tool: list_create
    reason: Saved-list creation. No /lists resource in the OpenAPI.
  - tool: list_enrich
    reason: Bulk enrichment of a saved list. No list resource, no bulk-enrich operation in REST.
  - tool: list_prospects
    reason: Saved-list retrieval. No list resource in the OpenAPI.
  - tool: watchlist_subscribe
    reason: >-
      Creates a monitoring subscription. Nothing in the OpenAPI writes state — the entire REST
      surface is read-only apart from two POST search operations.
  - tool: contacts_enrich_bulk
    reason: >-
      Bulk variant of enrichContact. REST exposes only the single-contact enrichment path
      /v1/contacts/{contact_id}/enrich.

# REST operations with no named MCP tool. Six of these are substantive data families the agent
# surface simply does not reach, which is the mirror image of the gap above.
rest_only:
  - operationId: getCarrierInsurance
    path: GET /v1/carriers/{dot_number}/insurance
    note: Insurance/BMC-91 filing history. No named tool, though the Lookup category advertises BMC-91.
  - operationId: getCarrierInsuranceByMc
    path: GET /v1/carriers/mc/{mc_number}/insurance
  - operationId: getCarrierTimeline
    path: GET /v1/carriers/{dot_number}/timeline
    note: Change-event feed with category counts — the closest thing the API has to an event surface.
  - operationId: getCarrierEquipmentForSale
    path: GET /v1/carriers/{dot_number}/equipment-for-sale
    note: Risk category advertises "equipment sale signals" but names no tool for it.
  - operationId: getVinInspectionHistory
    path: GET /v1/inspections/vin/{vin}
  - operationId: lookupVins
    path: GET /v1/vins
  - operationId: lookupVinsBatch
    path: POST /v1/vins
    note: VIN-level lookup is marketed heavily ("profiled to the VIN") but has no MCP tool.

coverage:
  mcp_tools_named: 24
  mcp_tools_advertised: '30+'
  rest_operations: 25
  bound: 18
  mcp_only: 6
  rest_only: 7
  bound_pct_of_named_tools: 75.0
  bound_pct_of_rest_operations: 72.0
  note: >-
    Neither surface is a superset. 18 of 24 named tools have a REST contract an agent developer can
    read today; 7 of 25 REST operations have no agent tool. The two surfaces diverge exactly along
    the read/write line — REST is read-only, and every unbound tool either writes state (lists,
    watchlist subscriptions) or runs the proprietary scoring model.
